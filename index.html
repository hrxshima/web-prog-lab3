<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ede9e1">
  <meta name="description" content="Slide and merge numbered tiles in a cascading 2048 puzzle.">
  <title>2048</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/responsive.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <main class="poster">
    <div class="poster-rule poster-rule--top" aria-hidden="true"><span></span></div>
    <div class="layout">
      <section class="console" aria-labelledby="game-title">
        <div class="masthead">
          <img class="masthead-moth" src="./assets/images/moth.svg" alt="">
          <h1 id="game-title">2048</h1>
        </div>

        <dl class="scores">
          <div class="score-card">
            <dt>Score</dt>
            <dd id="score">0</dd>
          </div>
          <div class="score-card score-card--best">
            <dt>Best</dt>
            <dd id="best">0</dd>
          </div>
        </dl>

        <div class="actions">
          <button class="button button--primary" id="new-game" type="button"><span aria-hidden="true">↻</span> New game</button>
          <button class="button" id="undo" type="button" disabled><span aria-hidden="true">↶</span> Undo</button>
          <button class="button button--wide" id="open-leaderboard" type="button"><span aria-hidden="true">▦</span> Leaderboard</button>
        </div>

        <section class="instructions" aria-labelledby="instructions-title">
          <h2 id="instructions-title">How to play</h2>
          <p id="controls-hint">Use the arrow keys or swipe the board. Match equal tiles to merge them.</p>
          <div class="keys" aria-hidden="true">
            <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd>
          </div>
        </section>
      </section>

      <section class="play-area" aria-label="Play area">
        <div class="board-collage">
          <span class="collage-paper" aria-hidden="true"></span>
          <span class="collage-print" aria-hidden="true"></span>
          <span class="collage-tape" aria-hidden="true"></span>
          <div class="board-frame">
            <div id="board" class="board" role="img" aria-label="2048 board" aria-describedby="controls-hint">
              <div class="board-cells" aria-hidden="true"></div>
              <div class="board-tiles" aria-hidden="true"></div>
            </div>
          </div>
          <img class="collage-flowers" src="./assets/images/flowers.svg" alt="">
        </div>
      </section>
    </div>
    <div class="poster-rule poster-rule--bottom" aria-hidden="true"><span></span></div>
    <p class="notice" id="notice" role="status" hidden></p>
    <p class="visually-hidden" id="game-status" role="status"></p>

    <dialog class="dialog dialog--leaderboard" id="leaderboard" aria-labelledby="leaderboard-title">
      <div class="dialog-header">
        <h2 id="leaderboard-title">Leaderboard</h2>
        <form method="dialog">
          <button class="button dialog-close" type="submit" aria-label="Close leaderboard" autofocus>×</button>
        </form>
      </div>
      <p id="empty-leaderboard">No scores saved yet.</p>
      <table id="records" hidden>
        <thead><tr><th scope="col">Rank</th><th scope="col">Name</th><th scope="col">Score</th><th scope="col">Date</th></tr></thead>
        <tbody></tbody>
      </table>
    </dialog>

    <dialog class="dialog dialog--game-over" id="game-over" aria-labelledby="game-over-title">
      <h2 id="game-over-title">Game over</h2>
      <p class="final-result">Final score <strong id="final-score"></strong></p>
      <form id="save-score">
        <label for="player-name">Your name</label>
        <input id="player-name" name="player-name" maxlength="24" required autocomplete="nickname" autofocus>
        <button class="button button--primary button--wide" type="submit">Save score</button>
      </form>
      <p id="saved-score" role="status" hidden>Your score has been saved.</p>
      <p id="save-error" role="alert" hidden></p>
      <button class="button button--wide" id="restart" type="button">New game</button>
    </dialog>
  </main>
</body>
</html>
